- id: m11_vegetarian_fact
  turns:
    - user: "i'm vegetarian btw"
      llm:
        - tool: remember
          args: {kind: diet, key: diet, value: vegetarian}
        - reply: "Got it — noted you're vegetarian."
  expect:
    tool_calls: [remember]
    forbidden_tools: [log_meal, revise_meal]
  expect_db:
    meal_count: 0
    memories:
      - {kind: diet, key: diet, status: active, value_contains: vegetarian}

