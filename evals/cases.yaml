- id: m01_log_breakfast
  turns:
    - user: "had 2 parathas and chai for breakfast"
      llm:
        - tool: log_meal
          args:
            items:
              - {name: paratha, quantity: 2, unit: piece}
              - {name: chai, quantity: 1, unit: cup}
            meal_slot: breakfast
        - reply: "Logged 2 parathas and chai for breakfast — about 312 kcal. Say the word if that's off."
  expect:
    tool_calls: [log_meal]
    forbidden_tools: [revise_meal, remember, recall, search_meals]
  expect_db:
    meal_count: 1
    totals_items:
      - {name: paratha, quantity: 2}
      - {name: chai, quantity: 1}

- id: m02_leftover_biryani
  turns:
    - user: "leftover biryani, maybe two thirds of the box"
      llm:
        - tool: log_meal
          args:
            items:
              - {name: biryani, quantity: 0.67, unit: bowl}
            meal_slot: lunch
        - reply: "Logged ~2/3 of the box as one bowl-ish portion of biryani for lunch."
  expect:
    tool_calls: [log_meal]
    forbidden_tools: [revise_meal]
  expect_db:
    meal_count: 1
    totals_items:
      - {name: biryani, quantity: 0.67}

- id: m03_grazed_afternoon_ambiguous
  turns:
    - user: "skipped lunch but grazed all afternoon"
      llm:
        - reply: "Got it, lunch skipped. For the grazing — roughly what was it: biscuits, nuts, fruit?"
  expect:
    tool_calls: []
    forbidden_tools: [log_meal, revise_meal, remember]
  expect_db:
    meal_count: 0

- id: m04_same_as_yesterday
  setup:
    meals:
      - items:
          - {name: poha, quantity: 1, unit: bowl}
        meal_slot: breakfast
        days_ago: 1
  turns:
    - user: "same as yesterday"
      llm:
        - tool: log_meal
          args:
            items:
              - {name: poha, quantity: 1, unit: bowl}
            meal_slot: breakfast
        - reply: "Logged the same poha breakfast as yesterday."
  expect:
    tool_calls: [log_meal]
    forbidden_tools: [search_meals, recall]
  expect_db:
    meal_count: 2
    totals_items:
      - {name: poha, quantity: 1}

- id: m05_correction_not_double
  turns:
    - user: "had 2 rotis for breakfast"
      llm:
        - tool: log_meal
          args:
            items:
              - {name: roti, quantity: 2, unit: piece}
            meal_slot: breakfast
        - reply: "Logged 2 rotis for breakfast."
    - user: "actually that was 3 rotis not 2"
      llm:
        - tool: revise_meal
          args:
            action: set_item_qty
            meal_ref: last
            item_id: "$item:roti"
            quantity: 3
        - reply: "Updated to 3 rotis — corrected, not doubled."
  expect:
    tool_calls: [log_meal, revise_meal]
    forbidden_tools: []
  expect_db:
    meal_count: 1
    totals_items:
      - {name: roti, quantity: 3}
    last_meal_items:
      - {name: roti, quantity: 3}

