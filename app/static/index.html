<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CalorAI</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --accent: #6c63ff;
    --accent-soft: #3d3875;
    --text: #e2e4ef;
    --text-muted: #7b7fa0;
    --green: #2dd4b4;
    --red: #f87171;
    --radius: 12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: grid;
    grid-template-columns: 1fr 320px;
    grid-template-rows: 56px 1fr;
    gap: 0;
  }

  /* ── Header ── */
  header {
    grid-column: 1 / -1;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
  }
  header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.3px; }
  header .pill {
    background: var(--accent-soft);
    color: #a89fff;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 20px;
  }

  /* ── Chat column ── */
  #chat-col {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: var(--radius);
    line-height: 1.55;
    font-size: 0.9rem;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent-soft);
    color: #d0ccff;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .msg.bot.streaming { opacity: 0.85; }

  .meal-card {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--green);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 0.82rem;
    max-width: 78%;
  }
  .meal-card h4 { color: var(--green); margin-bottom: 6px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.6px; }
  .meal-card table { width: 100%; border-collapse: collapse; }
  .meal-card td { padding: 2px 6px 2px 0; color: var(--text-muted); }
  .meal-card td:last-child { text-align: right; color: var(--text); }

  /* ── Input bar ── */
  #input-bar {
    padding: 12px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  #image-preview {
    width: 44px; height: 44px;
    border-radius: 8px;
    object-fit: cover;
    border: 1px solid var(--border);
    display: none;
    cursor: pointer;
  }

  #text-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.9rem;
    padding: 10px 14px;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    outline: none;
    line-height: 1.4;
  }
  #text-input:focus { border-color: var(--accent); }
  #text-input::placeholder { color: var(--text-muted); }

  .icon-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 10px;
    width: 44px; height: 44px;
    cursor: pointer;
    font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--text); }

  #send-btn {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  #send-btn:hover { background: #5a52d5; border-color: #5a52d5; color: #fff; }
  #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* ── Sidebar ── */
  #sidebar {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #totals-panel {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  #totals-panel h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 12px; }

  .macro-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 0;
    font-size: 0.85rem;
  }
  .macro-row .label { color: var(--text-muted); }
  .macro-row .value { font-weight: 600; }
  .macro-row .value.kcal { color: var(--accent); font-size: 1.1rem; }

  .bar-wrap { height: 4px; background: var(--border); border-radius: 2px; margin: 6px 0 10px; }
  .bar { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.4s; }

  #refresh-btn {
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 8px;
    padding: 6px;
    cursor: pointer;
    font-size: 0.78rem;
    margin-top: 8px;
  }
  #refresh-btn:hover { border-color: var(--accent); color: var(--text); }

  #meals-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
  }
  #meals-list h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 10px; }

  .meal-entry {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 0.8rem;
  }
  .meal-entry .slot { color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  .meal-entry .items { color: var(--text-muted); line-height: 1.6; }
  .meal-entry .kcal { color: var(--green); float: right; font-weight: 600; }

  #file-input { display: none; }

  .typing { color: var(--text-muted); font-size: 0.82rem; }
  .typing span { animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity:0.2; } 40% { opacity:1; } }
</style>
</head>
<body>

<header>
  <h1>🥗 CalorAI</h1>
  <span class="pill">meal logger</span>
</header>

<div id="chat-col">
  <div id="messages">
    <div class="msg bot">Hey! Tell me what you ate and I'll log it. You can also attach a photo 📸</div>
  </div>

  <div id="input-bar">
    <input type="file" id="file-input" accept="image/*"/>
    <img id="image-preview" src="" alt="preview" title="Click to remove"/>
    <button class="icon-btn" id="attach-btn" title="Attach image">📎</button>
    <textarea id="text-input" placeholder="What did you eat?" rows="1"></textarea>
    <button class="icon-btn" id="send-btn" title="Send">➤</button>
  </div>
</div>

<div id="sidebar">
  <div id="totals-panel">
    <h3>Today's totals</h3>
    <div class="macro-row">
      <span class="label">Calories</span>
      <span class="value kcal" id="t-kcal">—</span>
    </div>
    <div class="bar-wrap"><div class="bar" id="bar-kcal" style="width:0%"></div></div>
    <div class="macro-row"><span class="label">Protein</span><span class="value" id="t-protein">—</span></div>
    <div class="macro-row"><span class="label">Carbs</span><span class="value" id="t-carbs">—</span></div>
    <div class="macro-row"><span class="label">Fat</span><span class="value" id="t-fat">—</span></div>
    <button id="refresh-btn">↻ Refresh</button>
  </div>

  <div id="meals-list">
    <h3>Meals today</h3>
    <div id="meals-container"><p style="color:var(--text-muted);font-size:0.8rem">No meals yet.</p></div>
  </div>
</div>

<script>
const KCAL_GOAL = 2000;

let pendingImageId = null;
let isStreaming = false;

const messagesEl = document.getElementById('messages');
const textInput = document.getElementById('text-input');
const sendBtn = document.getElementById('send-btn');
const fileInput = document.getElementById('file-input');
const attachBtn = document.getElementById('attach-btn');
const imagePreview = document.getElementById('image-preview');

// ── auto-resize textarea ──
textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
});

textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

sendBtn.addEventListener('click', sendMessage);
attachBtn.addEventListener('click', () => fileInput.click());
document.getElementById('refresh-btn').addEventListener('click', loadTotals);

imagePreview.addEventListener('click', () => {
  pendingImageId = null;
  imagePreview.style.display = 'none';
  imagePreview.src = '';
});

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;

  // local preview
  const reader = new FileReader();
  reader.onload = e => {
    imagePreview.src = e.target.result;
    imagePreview.style.display = 'block';
  };
  reader.readAsDataURL(file);

  // upload
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch('/upload', { method: 'POST', body: form });
    const data = await res.json();
    pendingImageId = data.image_id;
  } catch (err) {
    appendMsg('bot', '⚠️ Image upload failed.');
  }
  fileInput.value = '';
});

function appendMsg(role, text, streaming = false) {
  const div = document.createElement('div');
  div.className = `msg ${role}${streaming ? ' streaming' : ''}`;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function appendMealCard(data) {
  const items = data.items || [];
  const totalKcal = items.reduce((s, i) => s + (i.kcal || 0), 0);
  const card = document.createElement('div');
  card.className = 'meal-card';
  card.innerHTML = `
    <h4>✅ Meal logged — ${data.meal_slot || 'meal'}</h4>
    <table>
      ${items.map(i => `
        <tr>
          <td>${i.qty ?? ''} ${i.unit ?? ''} ${i.name}</td>
          <td>${Math.round(i.kcal || 0)} kcal</td>
        </tr>
      `).join('')}
      <tr><td><strong>Total</strong></td><td><strong>${Math.round(totalKcal)} kcal</strong></td></tr>
    </table>
  `;
  messagesEl.appendChild(card);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function appendTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot typing';
  div.id = 'typing-indicator';
  div.innerHTML = '<span>●</span><span>●</span><span>●</span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  if (isStreaming) return;
  const text = textInput.value.trim();
  if (!text && !pendingImageId) return;

  isStreaming = true;
  sendBtn.disabled = true;

  if (text) appendMsg('user', text);
  else if (pendingImageId) appendMsg('user', '📸 (image)');

  textInput.value = '';
  textInput.style.height = 'auto';
  imagePreview.style.display = 'none';
  imagePreview.src = '';

  const typing = appendTyping();
  let botDiv = null;
  let gotToken = false;

  const body = { text, image_id: pendingImageId };
  pendingImageId = null;

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split('\n');
      buf = lines.pop();

      let eventType = 'message';
      for (const line of lines) {
        if (line.startsWith('event:')) {
          eventType = line.slice(6).trim();
        } else if (line.startsWith('data:')) {
          const raw = line.slice(5).trim();
          try {
            const payload = JSON.parse(raw);
            if (eventType === 'token') {
              if (!gotToken) {
                typing.remove();
                botDiv = appendMsg('bot', '', true);
                gotToken = true;
              }
              botDiv.textContent += payload.token;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            } else if (eventType === 'meal_logged') {
              appendMealCard(payload);
              await loadTotals();
              await loadMeals();
            } else if (eventType === 'done') {
              if (botDiv) botDiv.classList.remove('streaming');
              if (!gotToken) {
                typing.remove();
                if (payload.reply) appendMsg('bot', payload.reply);
              }
            }
          } catch {}
          eventType = 'message';
        }
      }
    }
  } catch (err) {
    typing.remove();
    appendMsg('bot', '⚠️ Something went wrong. Try again.');
  }

  isStreaming = false;
  sendBtn.disabled = false;
  textInput.focus();
}

async function loadTotals() {
  try {
    const res = await fetch('/totals');
    const d = await res.json();
    document.getElementById('t-kcal').textContent = Math.round(d.kcal) + ' kcal';
    document.getElementById('t-protein').textContent = Math.round(d.protein_g) + ' g';
    document.getElementById('t-carbs').textContent = Math.round(d.carbs_g) + ' g';
    document.getElementById('t-fat').textContent = Math.round(d.fat_g) + ' g';
    const pct = Math.min(100, (d.kcal / KCAL_GOAL) * 100);
    document.getElementById('bar-kcal').style.width = pct + '%';
  } catch {}
}

async function loadMeals() {
  try {
    const res = await fetch('/meals');
    const meals = await res.json();
    const container = document.getElementById('meals-container');
    if (!meals.length) {
      container.innerHTML = '<p style="color:var(--text-muted);font-size:0.8rem">No meals yet.</p>';
      return;
    }
    container.innerHTML = meals.map(m => {
      const kcal = m.items.reduce((s, i) => s + (i.kcal || 0), 0);
      const itemList = m.items.map(i => `${i.qty ?? ''} ${i.unit ?? ''} ${i.name}`.trim()).join(', ');
      return `
        <div class="meal-entry">
          <span class="kcal">${Math.round(kcal)} kcal</span>
          <div class="slot">${m.meal_slot}</div>
          <div class="items">${itemList || '—'}</div>
        </div>
      `;
    }).join('');
  } catch {}
}

// initial load
loadTotals();
loadMeals();
</script>
</body>
</html>
